:root{
  --bg:#05070d; --ink:#f2f6ff; --dim:rgba(220,230,255,.62); --faint:rgba(220,230,255,.32);
  --cyan:#35e0ff; --mag:#ff3d81; --amber:#ffb020; --lime:#7dffb0; --vio:#8b7bff; --red:#ff4a4a;
  --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:"IN",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#bg{position:absolute;inset:0;width:1920px;height:1080px}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;will-change:transform,opacity}
.cam{position:absolute;inset:0}
.abs{position:absolute}
.mono{font-family:"JB",monospace}
.sg{font-family:"SG","IN",sans-serif}
.up{text-transform:uppercase;letter-spacing:.16em}
.ctr{display:flex;align-items:center;justify-content:center}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(14px)}
.ch{display:inline-block;will-change:transform,opacity}
.tag{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:600 17px "JB",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.glow-c{filter:drop-shadow(0 0 22px rgba(53,224,255,.55))}
.glow-m{filter:drop-shadow(0 0 22px rgba(255,61,129,.55))}
.glow-a{filter:drop-shadow(0 0 22px rgba(255,176,32,.5))}

/* overlays */
#flare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(900px 500px at 20% 15%,rgba(80,140,255,.16),transparent 70%),radial-gradient(800px 500px at 85% 90%,rgba(255,60,140,.12),transparent 70%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.62) 100%)}
#grain{position:absolute;inset:-40px;pointer-events:none;opacity:.075;mix-blend-mode:overlay}
#scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 3px)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#brand{position:absolute;left:72px;top:46px;display:flex;align-items:center;gap:14px;font:700 17px "JB",monospace;letter-spacing:.22em;color:var(--ink)}
#brand i{width:12px;height:12px;border-radius:3px;background:var(--cyan);box-shadow:0 0 18px var(--cyan);display:block}
#chap{position:absolute;left:0;right:0;top:46px;text-align:center;font:600 17px "JB",monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#chap b{color:var(--cyan);font-weight:700;margin-right:12px}
#date{position:absolute;right:72px;top:46px;font:600 17px "JB",monospace;letter-spacing:.2em;color:var(--dim)}
#prog{position:absolute;left:72px;right:72px;bottom:38px;height:3px;background:rgba(255,255,255,.14);border-radius:3px}
#progf{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--mag));border-radius:3px;box-shadow:0 0 14px rgba(53,224,255,.6)}
.tick{position:absolute;top:-4px;width:2px;height:11px;background:rgba(255,255,255,.35)}
#srcpill{position:absolute;left:72px;bottom:70px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 14px;border-radius:999px;background:rgba(10,14,26,.72);border:1px solid var(--line);font:600 16px "JB",monospace;letter-spacing:.1em;color:var(--dim);opacity:0;text-transform:uppercase}
#srcpill i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
#cap{position:absolute;left:0;right:0;bottom:104px;display:flex;justify-content:center;pointer-events:none}
#capin{max-width:1480px;text-align:center;font:600 42px/1.28 "IN",sans-serif;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
#capin .w{opacity:.42;transition:none}
#capin .w.on{opacity:1}
#capin .w.cur{color:var(--cyan)}
body.nocap #cap{display:none}

/* start overlay */
#start{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#0d1530,#04060b 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer}
#start .t1{font:700 22px "JB",monospace;letter-spacing:.3em;color:var(--cyan)}
#start .t2{font:700 96px/1.02 "SG",sans-serif;letter-spacing:-.03em;text-align:center}
#start .t3{font:400 24px "IN",sans-serif;color:var(--dim)}
#start .btn{margin-top:18px;width:132px;height:132px;border-radius:50%;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(53,224,255,.4),inset 0 0 30px rgba(53,224,255,.2);animation:pulse 1.8s ease-in-out infinite}
#start .btn svg{width:52px;height:52px;fill:var(--cyan);margin-left:8px}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 90px rgba(53,224,255,.6),inset 0 0 40px rgba(53,224,255,.3)}}
#hint{position:absolute;right:30px;bottom:14px;font:400 14px "JB",monospace;color:rgba(255,255,255,.35);z-index:60;letter-spacing:.08em}
body.export #start,body.export #hint{display:none}
</style>

<script>/* ===== Deterministic motion engine: every frame is a pure function of time ===== */
const TL = window.TIMELINE;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const EA = {
  lin: t => t, inQ: t => t * t, outQ: t => 1 - (1 - t) * (1 - t), inC: t => t * t * t,
  outC: t => 1 - Math.pow(1 - t, 3), outE: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outQt: t => 1 - Math.pow(1 - t, 5),
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outB: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outEl: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
  step: t => t < 1 ? 0 : 1,
};
// seeded RNG
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const fmt = (n, d = 0) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const clean = s => s.toLowerCase().replace(/[^a-z0-9:$']/g, '');

/* ----- timeline lookups ----- */
const SEG = {}; TL.segments.forEach(s => SEG[s.id] = s);
const SCN = {}; TL.scenes.forEach(s => SCN[s.id] = s);
/** time a word/phrase begins inside a segment. q: "clicks" or "agent acts" ; n: nth match */
function W(seg, q, n = 0, off = 0) {
  const s = SEG[seg]; if (!s) throw new Error('seg ' + seg);
  if (q == null) return s.start + off;
  const toks = q.split(/\s+/).map(clean); let hit = 0;
  for (let i = 0; i < s.words.length; i++) {
    let ok = true;
    for (let j = 0; j < toks.length; j++) { const w = s.words[i + j]; if (!w || !clean(w.w).startsWith(toks[j])) { ok = false; break; } }
    if (ok) { if (hit++ === n) return s.words[i].t0 + off; }
  }
  throw new Error('no word ' + q + ' in ' + seg);
}
const E_ = seg => SEG[seg].end;

/* ----- actors ----- */
const DEF = { x: 0, y: 0, s: 1, sx: 1, sy: 1, r: 0, o: 1, blur: 0, rx: 0, ry: 0, br: 1 };
class Actor {
  constructor(n) { this.n = n; this.tw = []; this.hooks = []; this.sorted = false; this.last = ''; this.lastO = ''; this.base = Object.assign({}, DEF); }
  b(p) { Object.assign(this.base, p); return this; }
  at(t0, dur, props, ease = 'outC') {
    for (const k in props) { const v = props[k]; this.tw.push({ k, t0, dur: Math.max(dur, 1e-3), a: v[0], b: v[1], e: EA[ease] || ease }); }
    this.sorted = false; return this;
  }
  hook(f) { this.hooks.push(f); return this; }
  eval(t) {
    if (!this.sorted) {
      this.tw.sort((p, q) => p.t0 - q.t0); this.byk = {};
      for (const w of this.tw) (this.byk[w.k] = this.byk[w.k] || []).push(w);
      this.sorted = true;
    }
    const st = Object.assign({}, this.base);
    for (const k in this.byk) {
      const arr = this.byk[k]; let v = arr[0].a;
      for (const w of arr) { if (t >= w.t0) { v = lerp(w.a, w.b, w.e(clamp((t - w.t0) / w.dur))); } else break; }
      st[k] = v;
    }
    const n = this.n;
    if (this.tw.length || this.first !== false) {
      const tr = `translate3d(${st.x.toFixed(2)}px,${st.y.toFixed(2)}px,0)` + (st.rx ? ` rotateX(${st.rx.toFixed(2)}deg)` : '') + (st.ry ? ` rotateY(${st.ry.toFixed(2)}deg)` : '') + (st.r ? ` rotate(${st.r.toFixed(2)}deg)` : '') + ` scale(${(st.s * st.sx).toFixed(4)},${(st.s * st.sy).toFixed(4)})`;
      if (tr !== this.last) { n.style.transform = tr; this.last = tr; }
      const vis = st.o > 0.003;
      const oo = vis ? st.o.toFixed(3) : '0';
      const f = (st.blur > .3 ? `blur(${st.blur.toFixed(1)}px)` : '') + (Math.abs(st.br - 1) > .01 ? ` brightness(${st.br.toFixed(2)})` : '');
      const key = oo + '|' + f;
      if (key !== this.lastO) { n.style.opacity = oo; n.style.filter = f; n.style.visibility = vis ? 'visible' : 'hidden'; this.lastO = key; }
    }
    for (const h of this.hooks) h(t, st);
  }
}

/* ----- scene registry ----- */
const SCENES = []; let CUR = null;
function Scene(id, vs, ve, build) {
  const root = document.createElement('section'); root.className = 'scene'; root.id = 'sc_' + id;
  const cam = document.createElement('div'); cam.className = 'cam'; root.appendChild(cam);
  document.getElementById('world').appendChild(root);
  const sc = { id, vs, ve, root, cam, actors: [], shown: false, hooks: [] };
  SCENES.push(sc); CUR = sc;
  const rootA = A(root); const camA = A(cam);
  sc.rootA = rootA;
  build(cam, sc);
  camA.at(vs, ve - vs, { s: [1, 1.05], x: [0, -18], y: [0, -10] }, 'lin');
  return sc;
}
function A(node) { if (node._a) return node._a; const a = new Actor(node); node._a = a; CUR.actors.push(a); return a; }
function h(parent, cls, html, style) {
  const d = document.createElement('div'); if (cls) d.className = cls; if (html != null) d.innerHTML = html;
  if (style) d.style.cssText = style; parent.appendChild(d); return d;
}
function box(parent, x, y, w, hgt, cls = '', html = '', extra = '') {
  return h(parent, 'abs ' + cls, html, `left:${x}px;top:${y}px;` + (w != null ? `width:${w}px;` : '') + (hgt != null ? `height:${hgt}px;` : '') + extra);
}
/** center-anchored box */
function cbox(parent, cx, cy, w, hgt, cls = '', html = '', extra = '') {
  return box(parent, cx - w / 2, cy - hgt / 2, w, hgt, cls, html, extra);
}
function svg(parent, x, y, w, hgt, inner, extra = '') {
  const d = box(parent, x, y, w, hgt, '', `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" style="overflow:visible;display:block">${inner}</svg>`, extra);
  return d;
}
const IC = (name, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

/* helpers that bundle common tweens */
function popIn(a, t0, dur = .6, o = {}) {
  a.at(t0, dur, { o: [0, 1], y: [o.dy ?? 36, 0], x: [o.dx ?? 0, 0], s: [o.s0 ?? .94, 1], blur: [o.blur ?? 8, 0] }, o.e || 'outC'); return a;
}
function fadeOut(a, t0, dur = .4) { a.at(t0, dur, { o: [1, 0], y: [0, -16], blur: [0, 6] }, 'inQ'); return a; }
/** split text into per-char spans, return span actors with staggered entrance */
function kinetic(node, t0, o = {}) {
  const text = node.textContent; node.textContent = '';
  const spans = []; const words = text.split(' ');
  words.forEach((wd, wi) => {
    const wrap = document.createElement('span'); wrap.style.cssText = 'display:inline-block;white-space:nowrap' + (wi < words.length - 1 ? ';margin-right:.27em' : '');
    for (const c of wd) { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; wrap.appendChild(s); spans.push(s); }
    node.appendChild(wrap);
  });
  const st = o.stagger ?? .035;
  spans.forEach((s, i) => {
    const a = A(s).at(t0 + i * st, o.dur ?? .8, { o: [0, 1], y: [o.dy ?? 70, 0], blur: [o.blur ?? 14, 0], s: [o.s0 ?? 1.15, 1], r: [o.r ?? 0, 0] }, o.e || 'outC');
    if (o.out != null) a.at(o.out + i * .006, .4, { o: [1, 0], y: [0, -30], blur: [0, 8] }, 'inQ');
  });
  return spans;
}
function typeText(node, t0, cps, text, o = {}) {
  const caret = o.caret ?? true;
  return A(node).hook(t => {
    const n = Math.floor(clamp((t - t0) * cps, 0, text.length));
    const show = t >= t0;
    const done = n >= text.length;
    node.textContent = text.slice(0, n) + (caret && show && (!done || (Math.floor(t * 2) % 2 === 0 && !o.noblink)) ? '█' : '');
  });
}
function counter(node, t0, dur, from, to, d = 0, o = {}) {
  const pre = o.pre || '', suf = o.suf || '';
  return A(node).hook(t => {
    const p = EA[o.ease || 'outC'](clamp((t - t0) / dur));
    node.textContent = pre + fmt(lerp(from, to, p), d) + suf;
  });
}

/* ----- sources & sfx-visual flash/glitch ----- */
const SRC = []; const FLASH = []; const GLITCH = []; const SCANON = [];
function src(t0, t1, text) { SRC.push({ t0, t1, text }); }
function flash(t, dur = .5, amt = .9) { FLASH.push({ t, dur, amt }); }
function glitch(t, dur = .45, amt = 1) { GLITCH.push({ t, dur, amt }); }
</script>

  A(fig).at(TSTR - .4, 1.2, { o: [0, 1], x: [30, 0] }, 'outC');
  const figGlow = cbox(cityWrap, 1047, 960, 160, 160, '', '', 'background:radial-gradient(circle,rgba(53,224,255,.38),transparent 65%);border-radius:50%');
  A(figGlow).hook(t => { figGlow.style.opacity = (.5 + .5 * Math.sin(t * 3)).toFixed(2); }).at(TSTR, .8, { o: [0, 1] }, 'outC');

  /* ---- clock card ---- */
  const clk = box(cam, 120, 170, 470, 230, 'glass', `<div class="mono up" style="position:absolute;left:30px;top:24px;font-size:16px;color:var(--dim);letter-spacing:.2em">SEPTEMBER · MARKETPLACE PICKUP</div><div class="mono" id="clkd" style="position:absolute;left:28px;top:62px;font-size:118px;font-weight:700;letter-spacing:-.04em;line-height:1">9:27<span style="font-size:40px;margin-left:10px;color:var(--amber)">PM</span></div><div class="mono" style="position:absolute;left:32px;bottom:22px;font-size:15px;color:var(--faint);letter-spacing:.14em">BUYER ARRIVES · 9:15 PM</div>`);

    const n = box(cam, 160 + col * 830, 230 + row * 150, 780, 128, '', `<div class="glass" style="height:128px;border-radius:22px;padding:18px 26px"><div class="mono up" style="font-size:17px;letter-spacing:.16em;color:var(--cyan)">${s[0]} · ${s[2]}</div><div class="sg" style="font-size:27px;font-weight:500;line-height:1.25;margin-top:8px;color:#e8edff">${s[1]}</div></div>`);
    popIn(A(n), tD + .3 + i * .12, .5, { dy: 24, s0: .96 });
  });
  const disc = cbox(cam, 960, 880, 1600, 70, 'ctr', `<div class="mono up" style="font-size:16px;letter-spacing:.14em;color:var(--dim);text-align:center;line-height:1.6">Independent explainer · Details come from reports and company statements and may change · Not affiliated with any company named</div>`);
  popIn(A(disc), tD + 1.2, .6, { dy: 10 });
});
</script>
<script>/* ===== background, HUD, captions, overlays, playback ===== */
const EXPORT = new URLSearchParams(location.search).has('export');
if (EXPORT) document.body.classList.add('export');
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- background palettes ---------- */
// blobs: [r,g,b,alpha,xFrac,yFrac,radius]
const PAL = {
  s1: { top: [3, 5, 13], bot: [8, 16, 36], b: [[40, 90, 255, .26, .22, .22, 760], [255, 60, 120, .12, .8, .78, 640], [255, 170, 60, .10, .55, .62, 520]], acc: [255, 196, 110], grid: 0, rain: 1, code: 0, net: 0 },
  s2: { top: [6, 8, 24], bot: [10, 16, 44], b: [[80, 90, 255, .26, .75, .25, 780], [40, 210, 255, .16, .2, .7, 640], [150, 90, 255, .12, .5, .5, 560]], acc: [110, 220, 255], grid: .5, rain: 0, code: 0, net: 1 },
  s3: { top: [5, 7, 16], bot: [14, 14, 34], b: [[255, 160, 60, .13, .25, .35, 700], [60, 80, 220, .2, .8, .3, 760], [255, 60, 120, .08, .5, .85, 560]], acc: [255, 190, 110], grid: 0, rain: .6, code: 0, net: 0 },
  s4: { top: [10, 3, 6], bot: [26, 5, 12], b: [[255, 40, 60, .20, .2, .3, 760], [255, 60, 140, .10, .8, .8, 600], [40, 255, 150, .06, .55, .5, 520]], acc: [255, 90, 100], grid: .8, rain: 0, code: 1, net: .4 },
  s5: { top: [6, 6, 22], bot: [14, 10, 40], b: [[140, 100, 255, .26, .7, .3, 780], [40, 220, 255, .15, .2, .7, 640], [255, 90, 200, .09, .55, .9, 520]], acc: [170, 150, 255], grid: 0, rain: 0, code: 0, net: 1 },
  s6: { top: [5, 8, 20], bot: [10, 20, 40], b: [[255, 176, 32, .15, .25, .3, 700], [53, 224, 255, .15, .8, .6, 700], [139, 123, 255, .1, .5, .9, 520]], acc: [255, 200, 90], grid: .7, rain: 0, code: 0, net: 0 },
  s7: { top: [4, 10, 16], bot: [6, 24, 30], b: [[40, 255, 170, .15, .75, .25, 760], [53, 224, 255, .16, .2, .7, 640], [125, 255, 176, .08, .5, .9, 520]], acc: [125, 255, 190], grid: .5, rain: 0, code: 0, net: .5 },
  s8: { top: [5, 6, 20], bot: [12, 12, 42], b: [[110, 110, 255, .28, .5, .35, 900], [53, 224, 255, .14, .15, .75, 640], [255, 61, 129, .1, .85, .8, 560]], acc: [150, 200, 255], grid: 0, rain: 0, code: 0, net: .6 },
};
const ORDER = TL.scenes.map(s => s.id);
function palAt(t) {
  let i = 0; SCENES.forEach((sc, k) => { if (t >= sc.vs + .0) i = k; });
  const cur = PAL[ORDER[i]], prev = PAL[ORDER[Math.max(0, i - 1)]];
  const p = i === 0 ? 1 : EA.io(clamp((t - SCENES[i].vs) / .9));
  const L = (a, b) => lerp(a, b, p), LA = (a, b) => a.map((v, k) => L(b[k], v));
  return {
    top: LA(cur.top, prev.top), bot: LA(cur.bot, prev.bot), acc: LA(cur.acc, prev.acc),
    b: cur.b.map((bb, k) => LA(bb, prev.b[k])),
    grid: L(prev.grid, cur.grid), rain: L(prev.rain, cur.rain), code: L(prev.code, cur.code), net: L(prev.net, cur.net),
  };
}
const cv = document.getElementById('bg'), cx = cv.getContext('2d');
const R = rng(7);
const MOTES = Array.from({ length: 96 }, () => ({ x: R() * 1920, y: R() * 1080, v: .15 + R() * .5, s: .6 + R() * 2.2, ph: R() * 6.28, d: .3 + R() * .9 }));
const RAIN = Array.from({ length: 150 }, () => ({ x: R() * 2100 - 100, y: R() * 1200, v: 700 + R() * 700, l: 26 + R() * 50, a: .06 + R() * .12 }));
const CODEC = Array.from({ length: 52 }, (_, i) => ({ x: 20 + i * 37, off: R() * 1400, v: 90 + R() * 160, seed: Math.floor(R() * 1e6) }));
const GLY = '01ABCDEF<>{}[]/\\=+-*#$%0123456789';
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function drawBg(t) {
  const P = palAt(t);
  const g = cx.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, rgba(P.top, 1)); g.addColorStop(1, rgba(P.bot, 1));
  cx.globalCompositeOperation = 'source-over'; cx.fillStyle = g; cx.fillRect(0, 0, 1920, 1080);
  cx.globalCompositeOperation = 'screen';
  P.b.forEach((b, i) => {
    const x = (b[4] + Math.sin(t * .11 + i * 2.1) * .07) * 1920, y = (b[5] + Math.cos(t * .09 + i * 1.7) * .08) * 1080, r = b[6] * (1 + Math.sin(t * .2 + i) * .06);
    const rg = cx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, `rgba(${b[0] | 0},${b[1] | 0},${b[2] | 0},${b[3]})`); rg.addColorStop(1, `rgba(${b[0] | 0},${b[1] | 0},${b[2] | 0},0)`);
    cx.fillStyle = rg; cx.fillRect(0, 0, 1920, 1080);
  });
  // perspective grid floor
  if (P.grid > .02) {
    const hz = 590; cx.lineWidth = 1.2;
    for (let k = 0; k < 16; k++) {
      const z = ((k + (t * .35) % 1) / 16); const y = hz + Math.pow(z, 2.2) * (1080 - hz);
      cx.strokeStyle = rgba(P.acc, .20 * P.grid * Math.min(1, z * 2.2)); cx.beginPath(); cx.moveTo(0, y); cx.lineTo(1920, y); cx.stroke();
    }
    for (let k = -14; k <= 14; k++) {
      cx.strokeStyle = rgba(P.acc, .13 * P.grid); cx.beginPath(); cx.moveTo(960 + k * 40, hz); cx.lineTo(960 + k * 330, 1080); cx.stroke();
    }
    const gg = cx.createLinearGradient(0, hz - 90, 0, hz + 40); gg.addColorStop(0, 'rgba(0,0,0,0)'); gg.addColorStop(.5, rgba(P.acc, .10 * P.grid)); gg.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gg; cx.fillRect(0, hz - 90, 1920, 130);
  }
  // rain
  if (P.rain > .02) {
    cx.strokeStyle = 'rgba(170,200,255,1)'; cx.lineWidth = 1;
    for (const r of RAIN) {
      const y = (r.y + t * r.v) % 1250 - 100, x = r.x - y * .14;
      cx.globalAlpha = r.a * P.rain; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - r.l * .14, y + r.l); cx.stroke();
    }
    cx.globalAlpha = 1;
  }
  // code rain
  if (P.code > .02) {
    cx.font = '16px JB, monospace'; cx.textAlign = 'center';
    for (const c of CODEC) {
      const rr = rng(c.seed);
      for (let j = 0; j < 28; j++) {
        const y = ((c.off + t * c.v) % 1500) - j * 22 - 40; if (y < -20 || y > 1100) { rr(); continue; }
        const ch = GLY[Math.floor(rr() * GLY.length)];
        cx.fillStyle = j === 0 ? `rgba(255,190,190,${.5 * P.code})` : `rgba(255,70,90,${(.16 - j * .005) * P.code})`;
        cx.fillText(ch, c.x, y);
      }
    }
  }
  // motes + network
  const pts = [];
  for (const m of MOTES) {
    const x = (m.x + Math.sin(t * .2 * m.d + m.ph) * 40) % 1920, y = ((m.y - t * 14 * m.v) % 1160 + 1160) % 1160 - 40;
    pts.push([x, y]);
    const tw = .35 + .65 * Math.abs(Math.sin(t * m.d + m.ph));
    cx.fillStyle = rgba(P.acc, .55 * tw); cx.beginPath(); cx.arc(x, y, m.s, 0, 6.283); cx.fill();
  }
  if (P.net > .02) {
    cx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1], d2 = dx * dx + dy * dy;
      if (d2 < 24000) { cx.strokeStyle = rgba(P.acc, (1 - d2 / 24000) * .22 * P.net); cx.beginPath(); cx.moveTo(pts[i][0], pts[i][1]); cx.lineTo(pts[j][0], pts[j][1]); cx.stroke(); }
    }
  }
  cx.globalCompositeOperation = 'source-over';
}

/* ---------- grain ---------- */
const grainEl = document.getElementById('grain'); const GR = [];
(function () {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), id = g.createImageData(256, 256), r = rng(100 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); GR.push(c.toDataURL());
  }
})();

/* ---------- HUD ---------- */
const hudEls = { brand: document.getElementById('brand'), chap: document.getElementById('chap'), date: document.getElementById('date'), prog: document.getElementById('prog'), progf: document.getElementById('progf') };
TL.scenes.forEach(s => { const k = document.createElement('div'); k.className = 'tick'; k.style.left = (s.start / TL.total * 100) + '%'; hudEls.prog.appendChild(k); });
const HUD_ON = W('s1d', null) - .2;
let lastChap = '';
function hud(t) {
  const o = clamp((t - HUD_ON) / .9);
  hudEls.brand.style.opacity = hudEls.chap.style.opacity = hudEls.date.style.opacity = o;
  hudEls.prog.style.opacity = clamp(t / 1.5) * .9;
  hudEls.progf.style.width = clamp(t / TL.total) * 100 + '%';
  let idx = 0; TL.scenes.forEach((s, i) => { if (t >= s.start - .3) idx = i; });
  const label = `<b>${String(idx + 1).padStart(2, '0')}</b>${TL.scenes[idx].title}`;
  if (label !== lastChap) { hudEls.chap.innerHTML = label; lastChap = label; }
}

/* ---------- captions ---------- */
const PH = [];
TL.segments.forEach(s => {
  let wi = 0;
  s.phrases.forEach(p => {
    const n = p.text.split(/\s+/).length; const ws = s.words.slice(wi, wi + n); wi += n;
    if (ws.length) PH.push({ t0: ws[0].t0, t1: ws[ws.length - 1].t1, ws });
  });
});
const capIn = document.getElementById('capin'); let capIdx = -2, capOn = -1;
function caps(t) {
  let idx = -1;
  for (let i = 0; i < PH.length; i++) {
    const p = PH[i], nx = PH[i + 1]; const end = nx && nx.t0 - p.t1 < .6 ? nx.t0 : p.t1 + .45;
    if (t >= p.t0 - .06 && t < end) { idx = i; break; }
  }
  if (idx !== capIdx) {
    capIdx = idx; capOn = -1;
    capIn.innerHTML = idx < 0 ? '' : PH[idx].ws.map(w => `<span class="w">${w.w}</span>`).join(' ');
  }
  if (idx >= 0) {
    const ws = PH[idx].ws; let n = 0; ws.forEach(w => { if (t >= w.t0 - .02) n++; });
    if (n !== capOn) { capOn = n; [...capIn.children].forEach((c, i) => { c.classList.toggle('on', i < n); c.classList.toggle('cur', i === n - 1 && t < PH[idx].t1); }); }
  }
}

/* ---------- source pill ---------- */
const sp = document.getElementById('srcpill'); let spTxt = '';
function srcs(t) {
  let a = null; for (const s of SRC) if (t >= s.t0 && t < s.t1) a = s;
  if (!a) { sp.style.opacity = 0; return; }
  if (a.text !== spTxt) { sp.innerHTML = '<i></i><span>' + a.text + '</span>'; spTxt = a.text; }
  sp.style.opacity = Math.min(clamp((t - a.t0) / .4), clamp((a.t1 - t) / .4));
}

/* ---------- flash / glitch / scan ---------- */
const flashEl = document.getElementById('flash'), worldEl = document.getElementById('world');
const glt = document.getElementById('glt'), gld = document.getElementById('gld'), glo = document.getElementById('glo');
const scanEl = document.getElementById('scan');
function fx(t) {
  let f = 0; for (const e of FLASH) { const p = (t - e.t) / e.dur; if (p >= 0 && p < 1) f = Math.max(f, e.amt * Math.pow(1 - p, 2)); }
  flashEl.style.opacity = f;
  let g = 0; for (const e of GLITCH) { const p = (t - e.t) / e.dur; if (p >= 0 && p < 1) g = Math.max(g, e.amt * (1 - p) * (.55 + .45 * Math.sin(p * 40))); }
  if (g > .02) {
    const fr = Math.floor(t * 30);
    glt.setAttribute('seed', fr % 97); gld.setAttribute('scale', (g * 70).toFixed(1)); glo.setAttribute('dx', (g * 14 * (fr % 2 ? 1 : -1)).toFixed(1));
    worldEl.style.filter = 'url(#gl)';
  } else if (worldEl.style.filter) worldEl.style.filter = '';
  grainEl.style.backgroundImage = `url(${GR[Math.floor(t * 18) % 6]})`;
  const gi = Math.floor(t * 18); grainEl.style.backgroundPosition = `${(gi * 53) % 256}px ${(gi * 97) % 256}px`;
  // scanlines in hack scene
  const s4 = SCN.s4; scanEl.style.opacity = clamp(Math.min((t - s4.start + .6) / .8, (s4.end + .4 - t) / .8)) * .55;
}

/* ---------- render + playback ---------- */
function render(t) {
  for (const sc of SCENES) {
    const vis = t >= sc.vs && t < sc.ve;
    if (vis !== sc.shown) { sc.root.style.display = vis ? 'block' : 'none'; sc.shown = vis; }
    if (vis) for (const a of sc.actors) a.eval(t);
  }
  drawBg(t); hud(t); caps(t); srcs(t); fx(t);
}
const mix = document.getElementById('mix');
let T = 0; window.renderAt = t => { T = t; render(t); };
let clockMode = false, clockStart = 0, playing = false;
function curT() {
  if (EXPORT) return T;
  if (clockMode) return playing ? (performance.now() - clockStart) / 1000 : T;
  return mix.currentTime;
}
function loop() { if (!EXPORT) { T = curT(); } render(T); requestAnimationFrame(loop); }
function play() {
  document.getElementById('start').style.display = 'none';
  const pr = mix.play(); playing = true;
  if (pr && pr.catch) pr.catch(() => { clockMode = true; clockStart = performance.now() - T * 1000; });
  mix.addEventListener('error', () => { clockMode = true; clockStart = performance.now() - T * 1000; });
}
document.getElementById('start').addEventListener('click', play);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (document.getElementById('start').style.display !== 'none') return play(); if (mix.paused) { mix.play(); playing = true; clockStart = performance.now() - T * 1000; } else { mix.pause(); playing = false; } }
  if (e.code === 'ArrowRight') { mix.currentTime = Math.min(TL.total, mix.currentTime + 5); T = mix.currentTime; clockStart = performance.now() - T * 1000; }
  if (e.code === 'ArrowLeft') { mix.currentTime = Math.max(0, mix.currentTime - 5); T = mix.currentTime; clockStart = performance.now() - T * 1000; }
  if (e.key === 'c') document.body.classList.toggle('nocap');
  if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
hudEls.prog.style.pointerEvents = 'auto'; hudEls.prog.style.cursor = 'pointer'; hudEls.prog.style.height = '3px';
hudEls.prog.addEventListener('click', e => { const r = hudEls.prog.getBoundingClientRect(); const f = (e.clientX - r.left) / r.width; mix.currentTime = f * TL.total; T = mix.currentTime; clockStart = performance.now() - T * 1000; });
const urlT = new URLSearchParams(location.search).get('t'); if (urlT) T = parseFloat(urlT);
mix.addEventListener('ended', () => { playing = false; });
if (!EXPORT) { document.getElementById('hint').textContent = 'space: play/pause · ←/→ seek · c: captions · f: fullscreen'; }
requestAnimationFrame(loop);
</script>
